name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/QweNumpad.Core.Tests/QweNumpad.Core.Tests.csproj --configuration Release

      - name: Publish single-file executable
        run: dotnet publish src/QweNumpad.App/QweNumpad.App.csproj --configuration Release --output publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/QweNumpad.exe
          generate_release_notes: true
          body: |
            Download `QweNumpad.exe` below and run it. Single self-contained file, no .NET install needed.

            Note: the binary is unsigned, so Windows SmartScreen and some antivirus products will
            warn about it — a low-level keyboard hook in an unsigned executable is a textbook
            heuristic match. See the Security section of the README, or build from source.
