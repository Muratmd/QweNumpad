name: Idea / Öneri
description: Suggest a feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / Ne yapmaya çalışıyorsun?
      description: Describe the situation first, before the solution. "When I enter invoices in X, I have to …"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help? / Ne işine yarardı?
    validations:
      required: true
