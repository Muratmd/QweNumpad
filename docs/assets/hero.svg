<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">QweNumpad key mapping</title>
  <desc id="d">The letter keys q w e, a s d, z x c under the left hand map to numpad 7 8 9, 4 5 6, 1 2 3. Space maps to 0 and v to the decimal separator.</desc>
  <style>
    .key  { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hot  { fill: #dafbe1; stroke: #2da44e; stroke-width: 2; }
    .alt  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 2; }
    .pad  { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .big  { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; dominant-baseline: central; }
    .small{ font: 700 13px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: #1a7f37; text-anchor: end; }
    .altn { fill: #0969da; }
    .cap  { font: 500 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; text-anchor: middle; letter-spacing: .04em; }
    .arrow{ stroke: #2da44e; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .key  { fill: #161b22; stroke: #30363d; }
      .hot  { fill: #0f2d1a; stroke: #2ea043; }
      .alt  { fill: #0c2d4a; stroke: #388bfd; }
      .pad  { fill: #0d1117; stroke: #6e7681; }
      .big  { fill: #e6edf3; }
      .small{ fill: #3fb950; }
      .altn { fill: #58a6ff; }
      .cap  { fill: #9198a1; }
      .arrow{ stroke: #3fb950; }
    }
  </style>

  <!-- ===== Left hand: real keyboard stagger ===== -->
  <!-- row 1 -->
  <rect class="hot" x="40"  y="30" width="56" height="56" rx="9"/><text class="big" x="68"  y="56">Q</text><text class="small" x="90"  y="80">7</text>
  <rect class="hot" x="104" y="30" width="56" height="56" rx="9"/><text class="big" x="132" y="56">W</text><text class="small" x="154" y="80">8</text>
  <rect class="hot" x="168" y="30" width="56" height="56" rx="9"/><text class="big" x="196" y="56">E</text><text class="small" x="218" y="80">9</text>
  <rect class="key" x="232" y="30" width="56" height="56" rx="9"/><text class="big" x="260" y="58" opacity=".35">R</text>
  <!-- row 2 -->
  <rect class="hot" x="56"  y="94" width="56" height="56" rx="9"/><text class="big" x="84"  y="120">A</text><text class="small" x="106" y="144">4</text>
  <rect class="hot" x="120" y="94" width="56" height="56" rx="9"/><text class="big" x="148" y="120">S</text><text class="small" x="170" y="144">5</text>
  <rect class="hot" x="184" y="94" width="56" height="56" rx="9"/><text class="big" x="212" y="120">D</text><text class="small" x="234" y="144">6</text>
  <rect class="key" x="248" y="94" width="56" height="56" rx="9"/><text class="big" x="276" y="122" opacity=".35">F</text>
  <!-- row 3 -->
  <rect class="hot" x="80"  y="158" width="56" height="56" rx="9"/><text class="big" x="108" y="184">Z</text><text class="small" x="130" y="208">1</text>
  <rect class="hot" x="144" y="158" width="56" height="56" rx="9"/><text class="big" x="172" y="184">X</text><text class="small" x="194" y="208">2</text>
  <rect class="hot" x="208" y="158" width="56" height="56" rx="9"/><text class="big" x="236" y="184">C</text><text class="small" x="258" y="208">3</text>
  <rect class="alt" x="272" y="158" width="56" height="56" rx="9"/><text class="big" x="300" y="184">V</text><text class="small altn" x="322" y="208">,</text>
  <!-- space -->
  <rect class="hot" x="120" y="222" width="208" height="50" rx="9"/><text class="big" x="224" y="245" style="font-size:16px">space</text><text class="small" x="320" y="266">0</text>

  <text class="cap" x="184" y="306">LEFT HAND · HOME POSITION</text>

  <!-- ===== Arrow ===== -->
  <path class="arrow" d="M 368 152 L 452 152"/>
  <path class="arrow" d="M 438 138 L 454 152 L 438 166"/>

  <!-- ===== Numpad ===== -->
  <rect class="pad" x="496" y="30"  width="56" height="56" rx="9"/><text class="big" x="524" y="58">7</text>
  <rect class="pad" x="560" y="30"  width="56" height="56" rx="9"/><text class="big" x="588" y="58">8</text>
  <rect class="pad" x="624" y="30"  width="56" height="56" rx="9"/><text class="big" x="652" y="58">9</text>
  <rect class="pad" x="496" y="94"  width="56" height="56" rx="9"/><text class="big" x="524" y="122">4</text>
  <rect class="pad" x="560" y="94"  width="56" height="56" rx="9"/><text class="big" x="588" y="122">5</text>
  <rect class="pad" x="624" y="94"  width="56" height="56" rx="9"/><text class="big" x="652" y="122">6</text>
  <rect class="pad" x="496" y="158" width="56" height="56" rx="9"/><text class="big" x="524" y="186">1</text>
  <rect class="pad" x="560" y="158" width="56" height="56" rx="9"/><text class="big" x="588" y="186">2</text>
  <rect class="pad" x="624" y="158" width="56" height="56" rx="9"/><text class="big" x="652" y="186">3</text>
  <rect class="pad" x="496" y="222" width="120" height="50" rx="9"/><text class="big" x="556" y="247">0</text>
  <rect class="pad" x="624" y="222" width="56"  height="50" rx="9"/><text class="big" x="652" y="245">,</text>

  <text class="cap" x="588" y="306">NUMPAD</text>
</svg>
